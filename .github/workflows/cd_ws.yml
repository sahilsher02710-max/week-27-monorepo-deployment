name: Deploy the websocket server

on:
  push:
    branches: [ main ]

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push 
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.ws
          push: true
          tags: sahilsher02710/todo-app-websocket:${{ github.sha }}

      - name: Deploy to the VM
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key
          ssh -o StrictHostKeyChecking=no -i ~/ssh_key ubuntu@3.26.227.225 -t "\
            docker pull sahilsher02710/todo-app-websocket:${{ github.sha }} && \
            docker stop ws_backend || true && \
            docker rm ws_backend || true && \
            docker run --name ws_backend -d -p 8081:8080 sahilsher02710/todo-app-websocket:${{ github.sha }}"